name: Auto Buy Lottery

on:
  schedule:
    # 매주 목요일 07:37 KST (= 수요일 22:37 UTC) — Actions 예약이 수 시간 밀려도 연금복권 목 17:00 / 로또 토 20:00 마감 전에 구매되도록
    # 정각·UTC 자정(고부하 시간대)을 피함
    - cron: '37 22 * * 3'
  workflow_dispatch:
    inputs:
      ticket_count:
        description: '구매 장수 (1~5)'
        default: '5'
        required: false

jobs:
  buy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pycryptodome

      - name: Buy lottery tickets
        env:
          LOTTERY_USERNAME: ${{ secrets.LOTTERY_USERNAME }}
          LOTTERY_PASSWORD: ${{ secrets.LOTTERY_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TICKET_COUNT: ${{ github.event.inputs.ticket_count || '5' }}
        run: python backend/buy_lotto.py
